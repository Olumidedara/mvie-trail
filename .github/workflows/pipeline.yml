name: run-pipeline

on:
  workflow_dispatch:
    inputs:
      genre:
        description: "Genre to generate"
        required: false
        default: ""
      topic:
        description: "Custom topic"
        required: false
        default: ""
      count:
        description: "Number of videos"
        required: false
        default: "3"
  repository_dispatch:
    types: [run-pipeline]

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Verify ffmpeg
        run: ffmpeg -version | head -n 1

      - name: Resolve run inputs
        run: |
          echo "EVENT=${{ github.event_name }}" >> $GITHUB_ENV
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "PIPELINE_GENRE=${{ github.event.client_payload.genre }}" >> $GITHUB_ENV
            echo "PIPELINE_TOPIC=${{ github.event.client_payload.topic }}" >> $GITHUB_ENV
            echo "PIPELINE_COUNT=${{ github.event.client_payload.count }}" >> $GITHUB_ENV
          else
            echo "PIPELINE_GENRE=${{ inputs.genre }}" >> $GITHUB_ENV
            echo "PIPELINE_TOPIC=${{ inputs.topic }}" >> $GITHUB_ENV
            echo "PIPELINE_COUNT=${{ inputs.count }}" >> $GITHUB_ENV
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run pipeline
        run: python pipeline/pipeline.py run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Upload videos as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-videos
          path: output/jobs/**/*.mp4
          retention-days: 14

      - name: Commit manifest
        if: always()
        run: |
          git config user.name "pipeline-bot"
          git config user.email "pipeline-bot@users.noreply.github.com"
          git add output/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update video manifest [skip ci]"
            git push origin "HEAD:${GITHUB_REF#refs/heads/}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}